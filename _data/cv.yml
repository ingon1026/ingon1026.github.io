    Projects:
      - name: Hybrid LLM Navigation System
        summary: Event-driven semantic reasoning and policy selection for ROS2 navigation in crowded environments.
        highlights:
          - Combined YOLO, LiDAR, AMCL, Nav2, and an LLM router
          - Documented simulation success rate of 82% versus 43% for the Nav2 baseline

      - name: MobileViT Motorcycle Traffic-Violation Detection
        summary: Temporal traffic-event recognition integrated with ROS2 and deployed on Jetson Orin NX.
        highlights:
          - YOLO detection with MobileViT temporal analysis
          - Designed for real-time embedded operation

      - name: ROS2 UGV Platform Integration
        summary: UGV setup, sensor integration, CAN communication, SLAM, and navigation.

      - name: Few-Shot Writer Identification with Vision Transformers
        summary: Prototype-based meta-learning for identifying writers from limited handwriting samples; presented at a KICS conference.

      - name: Deep-Learning Camera Fault Detection
        summary: Detection and removal of camera noise and environmental artifacts during drone operation, using OpenCV detection and deep-learning denoising.

    Patents:
